name: Build and verify
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: clang-format --dry-run --Werror cpp/include/*.hpp cpp/src/*.cpp cpp/tests/*.cpp
      - run: python -m pytest -q
      - run: cmake -S . -B build/native -DNPUFORGE_PYTHON=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --parallel 2
      - run: ctest --test-dir build/native --output-on-failure
      - run: npuforge demo
      - run: python examples/compare_gemm_fusion.py
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: output/
